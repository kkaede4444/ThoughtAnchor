name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx install-electron
      - run: npm test
      - run: npm run package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Checksums
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          git -c core.autocrlf=false archive --format=zip --prefix="ThoughtAnchor-$version/" --output="release/ThoughtAnchor-$version-source.zip" HEAD
          Get-ChildItem release -File | Where-Object { $_.Name -like '*.exe' -or $_.Name -like '*-source.zip' } | ForEach-Object { $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower(); "$hash  $($_.Name)" } | Set-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ThoughtAnchor-Windows-x64
          path: |
            release/*.exe
            release/*-source.zip
            release/SHA256SUMS.txt
      - name: Check existing release
        id: existing
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag: context.ref.replace('refs/tags/', '') })
              core.setOutput('exists', 'true')
            } catch (error) {
              if (error.status !== 404) throw error
              core.setOutput('exists', 'false')
            }
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') && steps.existing.outputs.exists != 'true'
        with:
          body_path: docs/release-notes.md
          files: |
            release/*.exe
            release/*-source.zip
            release/SHA256SUMS.txt
